name: crawl

on:
  schedule:
    # Fires ~every 30 minutes. GitHub throttles high-frequency schedules, so
    # runs can be sparse — the in-app "Crawl now" button (repository_dispatch
    # below) is the reliable manual trigger.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab
  repository_dispatch:
    types: [crawl-now] # fired by the app's "Crawl now" button

# Avoid overlapping runs if one is slow.
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger crawl
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Manual triggers force past the overnight gate; the schedule respects it.
          FORCE: ${{ (github.event_name == 'schedule') && '' || '?force=1' }}
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron$FORCE"
